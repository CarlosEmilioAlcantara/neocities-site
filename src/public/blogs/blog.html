<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta 
   name="description" 
   content="This is a blog description" 
  />
  <link rel="stylesheet" type="text/css" href="../../index.css" />
  <link rel="stylesheet" type="text/css" href="./blog.css" />
 </head>
 <body>
  <div class="window">
   <div class="titlebar">
    <h2 class="title">
     <a href="./blog.html" class="header">
      This is a blog title
     </a>
    </h2>
    <span class="link-and-date">
     <small class="date">2001-07-04 16:19:00</small>
     <button id="back" class="back-button">Back</button>
    </span>
   </div>

   <div class="scrollbar">
    <div class="inside">
     <div class="image-wrapper content-border">
       <img 
        src="../../assets/images/v08-bg-rose.png" 
        alt="This is an alternative text" 
        class="banner-image"
       />
     </div>

     <div class="content">
      <p class="content-border">This is a blog content</p>
      <div class="image-wrapper content-border">
       <img src="../../assets/icons/notification/alert.svg" />
      </div>
      <p class="content-border">More content here</p>
     </div>
    </div>
   </div>
  </div>

  <script>
    document.querySelector("#back")
      .addEventListener(
        "click", 
        () => window.location.href = "/#/home"
      );
  </script>
 </body> 
</html>
