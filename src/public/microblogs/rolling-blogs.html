<html lang="en">
 <head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta 
   name="description" 
   content="This is a blog description" 
  />
  <link rel="stylesheet" type="text/css" href="../../index.css" />
  <link rel="stylesheet" type="text/css" href="../blogs.css" />
  <script type="module">
    import { fetchMicroBlogs } from "../../apis/fetchMicroBlogs.js";

    let microBlogs = {};
    let microBlogData = {};
    let microBlogsLength = 0;

    microBlogs = await fetchMicroBlogs({ rolling: true });
    
    microBlogData = microBlogs.microBlogData;
    microBlogsLength = microBlogs.length;

    microBlogData.map((blog) => {
      const microBlog = document.createElement("div");
      microBlog.classList.add("content-border");

      const post = document.createElement("p");
      post.innerText = `${blog.post}`;

      const footer = document.createElement("footer");
      footer.innerText = ` — Snibbenings, ${blog.date}`;

      microBlog.appendChild(post);
      microBlog.appendChild(footer);

      document.querySelector(".content").appendChild(microBlog);
    })
  </script>
 </head>
 <body>
  <div class="window">
   <div class="titlebar">
    <h2 class="title">
     <a href="../../public/microblogs/rolling-blogs.html" class="header">
      Rolling Microblogs
     </a>
    </h2>
    <span class="link-and-date">
     <button id="back" class="back-button">Back</button>
    </span>
   </div>

   <div class="scrollbar">
    <div class="inside">
     <div class="spacer"></div>

     <div class="content">
     </div>

     <div class="spacer"></div>
    </div>
   </div>
  </div>

  <script src="../../utils/navigation/navigation.js"></script>
 </body> 
</html>
