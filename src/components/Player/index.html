<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <meta http-equiv="X-UA-Compatible" content="IE=edge">
 <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <title>Cassette Player</title>
 <link rel="stylesheet" href="assets/css/style.css">
 <link rel="shortcut icon" href="assets/favicon/icon.png" type="image/x-icon">
</head>
<body>
 <div class="page-container">
  <div class="cassette-player">
   <div class="carriage-container">
    <div class="carriage">
     <div class="carriage-window">
      <div class="carriage-inside"></div>
     </div>
     <div class="carriage-window">
      <div class="carriage-inside"></div>
     </div>
     <div class="carriage-window">
      <div class="carriage-inside"></div>
     </div>
     <div class="carriage-window">
      <div class="carriage-inside"></div>
     </div>

     <div class="casette-body">
      <div class="screw"><div></div></div>
      <div class="screw"><div></div></div>
      <div class="screw"><div></div></div>
      <div class="screw"><div></div></div>
       <div class="label">
        <div class="label-descp">
         <div class="line"></div>
         <div class="line"></div>
        </div>

        <div class="player">
         <div class="tape">
          <div class="reel">
           <div class="circle" id="circle1">
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
           </div>
          </div>

          <div class="window">
           <div class="song-info">
            <div class="icon">
             <img 
              src="./assets/favicon/note.webp" 
              alt="Song: " 
              title="Musical Note " 
             />
            </div>

            <p id="song">PAUSED</p>
           </div>

           <span class="song-info">
            <div class="icon">
             <img 
              src="./assets/favicon/person.webp" 
              alt="Artist: " 
              title="Person " 
             />
            </div>

            <p id="artist">PAUSED</p>
           </span>
          </div>

          <div class="reel">
           <div class="circle" id="circle2">
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
            <div class="teeth"></div>
           </div>
          </div>
         </div>
        </div>
       </div>

       <div class="tape-footer-container">
        <div class="tape-footer">
         <div class="holes holes-1">
          <div class="hole radial"></div>
          <div class="hole square"></div>
         </div>

         <div class="holes holes-2">
          <div class="hole radial"></div>
         </div>

         <div class="holes holes-3">
          <div class="hole radial"></div>
          <div class="hole square"></div>
         </div>
        </div>
       </div>
      </div>
     </div>
    </div>

   <!--
    <div class="runtime">
    </div>      
   -->

   <div class="controls-wrapper">
    <div class="controls">
     <div class="volume-container">
      <div class="volume">
       <img src="./assets/favicon/Sound.png"/>

       <div class="volume-slider-container">
        <div class="volume-slider-border-outer"></div>
        <div class="volume-slider-border-inner"></div>

        <input 
         type="range" 
         min="0" 
         max="7" 
         value="0"
         list="tickmarks" 
         class="volume-slider" 
        />

        <div class="volume-range">
         <div class="range">0</div>
         <div class="range">1</div>
         <div class="range">2</div>
         <div class="range">3</div>
         <div class="range">4</div>
         <div class="range">5</div>
         <div class="range">6</div>
         <div class="range">7</div>
        </div>

        <div class="volume-tickmarks">
         <div class="range">|</div>
         <div class="range">|</div>
         <div class="range">|</div>
         <div class="range">|</div>
         <div class="range">|</div>
         <div class="range">|</div>
         <div class="range">|</div>
         <div class="range">|</div>
        </div>

        <datalist id="tickmarks">
         <option>0</option>
         <option>1</option>
         <option>2</option>
         <option>3</option>
         <option>4</option>
         <option>5</option>
         <option>6</option>
         <option>7</option>
        </datalist>
       </div>

       <img src="./assets/favicon/Sound.png"/>
      </div>
     </div>

     <div class="below">
      <div id="rewind" class="control-container">
       <button class="rewind-button"></button>
      </div>

      <div id="seek-backwards" class="control-container">
       <button class="seek-backwards-button"></button>
      </div>

      <div id="play" class="control-container">
       <button class="play-button "></button>
      </div>

      <div id="pause" class="control-container">
       <button class="seek-forwards-button"></button>
      </div>

      <div id="seek-forwards" class="control-container">
       <button class="skip-button"></button>
      </div>

      <div id="skip" class="control-container">
       <button class="pause-button"></button>
      </div>
     </div>
    </div>
   </div>
  </div>
 </div>
 </div>
 <script src="assets/js/index.js"></script>
</body>
</html>
